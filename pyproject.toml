[project]
name = "nlp-2023"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==2.21.0",
    "ipykernel==6.30.1",
    "ipywidgets==8.1.0",
    "matplotlib>=3.11.2",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "pyarrow==16.1.0",
    "scikit-learn>=1.9.1",
    "torch==2.7.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
